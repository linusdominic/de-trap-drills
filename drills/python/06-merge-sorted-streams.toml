title = "Merge two sorted streams"
family = "Streams"
pattern = "Lazy iteration"
function = "merge_streams"

prompt = '''
`a` and `b` are streams of numbers, each already in ascending order. Return their merge, in ascending order. When both streams offer the same value, take the one from `a` first.

The streams are iterators: you can read each one once, you cannot ask for its length, and it may never end. The caller takes as many merged items as it needs.
'''

starter = '''
def merge_streams(a, b):
    ...
'''

naive = '''
def merge_streams(a, b):
    return sorted(list(a) + list(b))
'''

reference = '''
def merge_streams(a, b):
    missing = object()
    x, y = next(a, missing), next(b, missing)
    while x is not missing and y is not missing:
        if x <= y:
            yield x
            x = next(a, missing)
        else:
            yield y
            y = next(b, missing)
    while x is not missing:
        yield x
        x = next(a, missing)
    while y is not missing:
        yield y
        y = next(b, missing)
'''

trap = '''
`sorted(list(a) + list(b))` gives the right answer on every small test, and it reads both inputs to the end before producing anything. On a stream that never ends it never returns; on a 200 GB file it runs out of memory.

Hold one item from each stream, yield the smaller, and refill from the stream it came from. Memory is two items whatever the input size, and the first result is available immediately.

`heapq.merge(a, b)` from the standard library does exactly this, for any number of streams. Mention it, then show you can write it.
'''

scale = '''
This is the merge step of an external sort and of a sort-merge join: sort chunks that fit in memory, write them out, then merge the sorted runs holding only one row per run. It is also why engines can join two huge tables that are already sorted or bucketed on the key without a shuffle.
'''

[[cases]]
name = "two short streams"
args = '''[{"$stream": [1, 4, 9]}, {"$stream": [2, 3, 10, 11]}]'''

[[cases]]
name = "one stream is empty"
args = '''[{"$stream": []}, {"$stream": [5, 6]}]'''

[[cases]]
name = "equal values"
args = '''[{"$stream": [1, 2, 2]}, {"$stream": [2, 3]}]'''

[[cases]]
name = "two streams that never end, first 8 items"
args = '''[{"$endless": [0, 2]}, {"$endless": [1, 3]}]'''
take = 8
