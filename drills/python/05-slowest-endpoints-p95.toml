args = '''[["2026-03-01T10:00:00Z GET /loans 200 40ms", "2026-03-01T10:00:01Z GET /loans 200 60ms", "2026-03-01T10:00:02Z POST /leads 201 20ms", "2026-03-01T10:00:03Z GET /health 200 2ms"]]'''

