title = "Dimension design"
area = "Data modeling"
level = "advanced"
summary = "Surrogate keys, shared dimensions, late-arriving members and many-to-many relationships: the choices that modeling follow-ups probe."
drills = ["scd2-as-of-join"]

idea = '''
Dimensions hold the descriptive context of facts: the customer, the product, the store, the date. Most of the hard modeling questions are about them.

**Surrogate keys.** Give each dimension row a key generated by the warehouse, separate from the source system's business key. It lets one customer have several rows (versions over time), survives a source that reuses or changes its ids, and lets several source systems map to one dimension. The fact stores the surrogate key.

**History.** Type 1 overwrites an attribute and loses the old value. Type 2 adds a new row with a validity range, so a fact can point at the version that was true when it happened. Choose per attribute: a corrected typo is Type 1, and a change of city that should not move past sales is Type 2.

**Conformed dimensions.** One customer dimension and one date dimension, shared by every fact table. This is what lets you compare measures from different facts: aggregate each fact by the shared dimension, then join the results.

**Late-arriving dimensions.** A fact arrives before its dimension row exists. Do not drop the fact and do not leave the key NULL. Point it at a reserved unknown member, or insert a placeholder row that has only the business key, and update it when the real attributes arrive.

**Many-to-many.** A trip with several riders, an account with several holders. A fact row cannot hold two keys to one dimension, so add a bridge table between the fact and the dimension, with a weighting factor if measures must be allocated.

**When not to normalise.** A snowflake of small lookup tables saves little storage and costs joins. And when one dashboard needs speed more than flexibility, a single wide table built from the star is a legitimate answer.
'''

asked = [
  "Why use a surrogate key when the source already has a customer id?",
  "A fact row arrives and its customer is not in the dimension yet. What do you do?",
  "A loan can have two borrowers. How do you model that?",
]

answer = [
  "Separate the surrogate key from the business key and say what that makes possible.",
  "Choose Type 1 or Type 2 for each attribute, from what the reports need.",
  "Share conformed dimensions across facts so that their measures can be compared.",
  "Handle a late-arriving dimension with an unknown member or a placeholder row.",
  "Use a bridge table for many-to-many, and say how measures are allocated.",
]

[[probes]]
q = "How does the fact get the right version of a Type 2 dimension?"
a = "At load time, look up the dimension row whose validity range contains the fact's date and store that surrogate key on the fact. Later queries are plain equality joins, and history cannot be rewritten by accident."

[[probes]]
q = "What goes wrong with a bridge table?"
a = "It fans out: a loan with two borrowers appears twice, so the loan amount doubles when it is summed by borrower attributes. Use a weighting factor that sums to one per group, or report such measures at loan level only."

[[probes]]
q = "What is in the unknown member?"
a = "A reserved row, often with key 0 or -1, whose attributes read as unknown. Facts that cannot be matched point to it, so inner joins keep them and reports show an explicit unknown bucket instead of losing rows."

[[examples]]
title = "A fact whose dimension row has not arrived yet"
setup = '''
CREATE TABLE dim_customer (customer_key INTEGER, customer_id INTEGER, city VARCHAR);
INSERT INTO dim_customer VALUES (0, NULL, 'Unknown'), (1, 10, 'Karachi'), (2, 11, 'Lahore');
CREATE TABLE stg_orders (order_id INTEGER, customer_id INTEGER, amount INTEGER);
INSERT INTO stg_orders VALUES (1, 10, 100), (2, 11, 40), (3, 12, 70);
'''
code = '''
SELECT
  o.order_id,
  o.amount,
  COALESCE(d.customer_key, 0) AS customer_key,
  COALESCE(d.city, 'Unknown') AS city
FROM stg_orders AS o
LEFT JOIN dim_customer AS d ON d.customer_id = o.customer_id
ORDER BY o.order_id
'''
note = "Customer 12 is not in the dimension yet. Order 3 gets key 0, the unknown member, and stays in every total. An inner join on `customer_id` would have dropped it and 70 of revenue with it."
