title = "Sort order and data skipping"
area = "Performance at scale"
level = "advanced"
summary = "Min/max statistics only let an engine skip data when rows with nearby values are stored together, which is what sorting and clustering do."
experiment = "sorted"

idea = '''
Columnar files store data in row groups, and each row group keeps the minimum and maximum of every column. A filter can skip a row group when the value it looks for is outside that range. Whether that ever happens depends on the order the rows were written in.

Take an events table written in arrival order, and a filter on `user_id`. Every row group holds users from across the whole range of ids, so every min/max range includes the user you want and nothing is skipped. Write the same rows sorted by `user_id` and each row group covers a narrow band of ids. The lookup now reads only the groups whose band contains the id. The measurement below runs that comparison.

The idea has several names: sort keys in Redshift, clustering keys in Snowflake, clustered tables in BigQuery, Z-ordering and liquid clustering in Delta Lake, sort orders in Iceberg. The mechanisms differ. The principle is the same: rows with nearby values sit together, so the statistics become selective.

What to say about the cost:

- **A copy of the data has one physical order.** Sorting by `user_id` helps lookups by user and does nothing for a filter on `city`. Multi-column schemes such as Z-ordering spread the benefit over several columns and weaken it for each.
- **The order decays.** New data arrives in time order, so the table needs re-sorting or re-clustering. That is compute you pay on every load or on a schedule.
- **Time usually takes the first slot.** Most queries filter on a date range and data arrives in time order anyway. Partition by date, then sort inside the partition by the next most common filter.
- **Sorted data also compresses better**, because similar values sit next to each other.
'''

asked = [
  "Lookups by customer id on this table are slow even though it is stored as Parquet. Why?",
  "How do you choose a sort key or a clustering key?",
  "What is Z-ordering for?",
]

answer = [
  "Explain min/max statistics per row group, and why unsorted data makes them useless for a point lookup.",
  "Choose the key from the most common selective filter, after the partition column.",
  "Name the cost: one order per copy, and the order must be maintained as data arrives.",
  "Mention the multi-column schemes and that they trade strength for breadth.",
  "Check the effect in the plan or the scan metrics: row groups or bytes skipped.",
]

[[probes]]
q = "Two teams filter on different columns. What do you do?"
a = "Pick the order that serves the heavier or more expensive workload, and consider a multi-column clustering scheme if both columns are selective. A second sorted copy or a summary table is the remaining option, and it has to be stored and maintained."

[[probes]]
q = "Does sorting help a full aggregation over the table?"
a = "Not through skipping, because every row is needed. It can still improve compression, but the main gain is for selective filters."

[[probes]]
q = "Why not just add an index?"
a = "Most analytical warehouses and lake formats have no B-tree style secondary indexes. They rely on partitioning, ordering and statistics instead. Some offer extras for point lookups, such as Bloom filters, and those are worth naming for the specific engine."

[[examples]]
title = "The same rows in two orders: how many row groups must be read for user 42?"
setup = '''
CREATE TABLE row_groups (layout VARCHAR, group_no INTEGER, min_user INTEGER, max_user INTEGER);
INSERT INTO row_groups VALUES
  ('written in time order', 1, 3, 98),
  ('written in time order', 2, 1, 100),
  ('written in time order', 3, 2, 97),
  ('written in time order', 4, 5, 99),
  ('sorted by user_id', 1, 1, 25),
  ('sorted by user_id', 2, 26, 50),
  ('sorted by user_id', 3, 51, 75),
  ('sorted by user_id', 4, 76, 100);
'''
code = '''
SELECT
  layout,
  COUNT(*) AS row_groups,
  COUNT(*) FILTER (WHERE 42 BETWEEN min_user AND max_user) AS must_read
FROM row_groups
GROUP BY layout
ORDER BY must_read DESC
'''
note = "In time order every row group's range contains 42, so all four are read. Sorted by user, one is."
